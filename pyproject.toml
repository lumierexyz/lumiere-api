[project]
name = "lumiere-backend"
version = "0.1.0"
description = "Lumiere financial intelligence backend: expense analytics, Personal Expense Index, forecasting, coverage, AI agent, hedging research."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "cvxpy>=1.5",
  "python-multipart>=0.0.9",
  "anthropic>=2.6.0",
  "openai>=3.46.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
